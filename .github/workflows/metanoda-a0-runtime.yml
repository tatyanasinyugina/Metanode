name: METANODA A0 Runtime

on:
  push:
    branches:
      - agents/social-media-execution
    paths:
      - "runtime/**"
      - "operations/**"
      - ".github/workflows/metanoda-a0-runtime.yml"
    paths-ignore:
      - "operations/receipts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metanoda-a0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-validation:
    name: Validate source and handoff package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-only A0 validator
        run: python runtime/a0_orchestrator.py

  outbound-handoff:
    name: Deliver queued task to external executor
    needs: bootstrap-validation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check protected executor configuration
        id: config
        env:
          EXECUTOR_URL: ${{ secrets.METANODA_EXECUTOR_URL }}
          EXECUTOR_TOKEN: ${{ secrets.METANODA_EXECUTOR_TOKEN }}
        run: |
          if [ -n "$EXECUTOR_URL" ] && [ -n "$EXECUTOR_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send outbound execution envelope
        id: send
        if: steps.config.outputs.configured == 'true'
        env:
          EXECUTOR_URL: ${{ secrets.METANODA_EXECUTOR_URL }}
          EXECUTOR_TOKEN: ${{ secrets.METANODA_EXECUTOR_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          REQUEST_PATH: operations/OUTBOUND_EXECUTION_REQUEST_2026-11-11_01.md
        run: |
          python - <<'PY'
          import json, os
          payload = {
              "system": "METANODA",
              "event": "outbound_execution_request",
              "repository": os.environ["REPOSITORY"],
              "branch": os.environ["BRANCH"],
              "commit_sha": os.environ["COMMIT_SHA"],
              "request_path": os.environ["REQUEST_PATH"],
              "idempotency_key": os.environ["COMMIT_SHA"],
              "callback": {
                  "repository": os.environ["REPOSITORY"],
                  "branch": os.environ["BRANCH"],
                  "receipt_directory": "operations/receipts/"
              }
          }
          with open("outbound-envelope.json", "w") as f:
              json.dump(payload, f)
          PY
          curl --fail-with-body --silent --show-error \
            --max-time 45 \
            -X POST "$EXECUTOR_URL" \
            -H "Authorization: Bearer $EXECUTOR_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: $COMMIT_SHA" \
            --data-binary @outbound-envelope.json

      - name: Record adapter unavailable without exposing secrets
        if: steps.config.outputs.configured != 'true'
        run: |
          echo "OUTBOUND_ADAPTER=BLOCKED"
          echo "REASON=Protected GitHub Actions secrets METANODA_EXECUTOR_URL and/or METANODA_EXECUTOR_TOKEN are not configured."
          echo "No external request was sent."

      - name: Return execution receipt to GitHub
        if: always()
        uses: actions/github-script@v7
        env:
          EXECUTOR_CONFIGURED: ${{ steps.config.outputs.configured }}
          SEND_OUTCOME: ${{ steps.send.outcome }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const receipt = {
              system: "METANODA",
              request_id: "METANODA-OUTBOUND-2026-11-11-01",
              github_run_id: process.env.RUN_ID,
              github_run_url: process.env.RUN_URL,
              source_repository: process.env.REPOSITORY,
              source_branch: process.env.BRANCH,
              source_commit: process.env.COMMIT_SHA,
              source_validation: "PASS",
              outbound_adapter_status: process.env.EXECUTOR_CONFIGURED === "true" ? process.env.SEND_OUTCOME : "BLOCKED",
              provider_receipt_status: "NOT_RECEIVED",
              publication_status: "NOT_AUTHORIZED",
              returned_to_github: true,
              note: process.env.EXECUTOR_CONFIGURED === "true" ? "Outbound adapter was configured; inspect send outcome and provider callback." : "Protected executor URL/token are not configured; no external request was sent."
            };
            const path = `operations/receipts/${process.env.RUN_ID}_outbound.json`;
            const content = Buffer.from(JSON.stringify(receipt, null, 2) + "\\n").toString("base64");
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `Return METANODA execution receipt for run ${process.env.RUN_ID}`,
              content,
              branch: process.env.BRANCH
            });
            core.info(`Receipt committed: ${path}`);
