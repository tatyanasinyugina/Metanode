name: METANODA AI Agent Team

on:
  push:
    branches:
      - agents/social-media-execution
    paths:
      - "runtime/metanoda_agent_team.py"
      - "operations/agent_queue/**"
      - ".github/workflows/metanoda-agent-team.yml"

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: metanoda-agent-team-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent-team:
    name: Run isolated public-source agent pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agents/social-media-execution

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run four-stage agent team
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: python runtime/metanoda_agent_team.py

      - name: Save report to GitHub
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d operations/agent_runs ] && [ -n "$(git status --porcelain operations/agent_runs)" ]; then
            git config user.name "metanoda-agent-runtime"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add operations/agent_runs/
            git commit -m "Record METANODA AI agent run"
            git push origin HEAD:agents/social-media-execution
          else
            echo "No report generated; nothing to commit."
          fi
